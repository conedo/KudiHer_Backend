<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KudiHer Login</title>
    <style>
      :root {
        --bg: #f8fafc;
        --panel: #ffffff;
        --text: #101828;
        --muted: #667085;
        --line: #d0d5dd;
        --primary: #1570ef;
        --primary-hover: #175cd3;
        --danger-bg: #fef3f2;
        --danger-text: #b42318;
        --shadow: 0 20px 45px rgba(16, 24, 40, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .auth-shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(360px, 520px);
      }

      .brand-panel {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 48px;
        
      
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
        font-size: 20px;
      }

      .brand-mark {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border-radius: 8px;
        background: #ffffff;
        color: var(--primary);
        font-weight: 900;
      }

      .brand-copy {
        max-width: 560px;
      }

      .brand-copy h2 {
        margin: 0 0 16px;
        font-size: 44px;
        line-height: 1.05;
        letter-spacing: 0;
      }

      .brand-copy p {
        margin: 0;
        color: rgba(255, 255, 255, 0.84);
        font-size: 17px;
        line-height: 1.7;
      }

     .form-panel {
        display: grid;
        place-items: center;
        padding: 32px;
        position: fixed;
        inset: 0;
        z-index: 1;
             }
      

      .card {
        width: min(100%, 420px);
        padding: 36px;
        border: 1px solid #eaecf0;
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 30px;
        line-height: 1.2;
      }

      p {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.55;
      }

      .btn,
      .oauth-btn {
        display: block;
        text-align: center;
        width: 100%;
        border: none;
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 15px;
        font-weight: 700;
        line-height: 1.4;
        cursor: pointer;
        text-decoration: none;
        transition: background 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
      }

      .oauth-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 20px;
        background: #ffffff;
        border: 1px solid var(--line);
        color: #344054;
      }

      .oauth-btn:hover {
        border-color: #98a2b3;
        box-shadow: 0 1px 2px rgba(16, 24, 40, 0.08);
      }

      .google-icon {
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
      }

      .primary {
        background: var(--primary);
        color: #ffffff;
      }

      .primary:hover {
        background: var(--primary-hover);
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 14px;
        text-align: center;
        color: var(--muted);
        margin: 20px 0;
        font-size: 14px;
      }

      .divider::before,
      .divider::after {
        content: "";
        height: 1px;
        flex: 1;
        background: #eaecf0;
      }

      form {
        display: grid;
        gap: 16px;
      }

      label {
        display: grid;
        gap: 8px;
        font-size: 14px;
        font-weight: 600;
        color: #344054;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font-size: 16px;
        background: #ffffff;
        color: var(--text);
        outline: none;
        transition: border-color 160ms ease, box-shadow 160ms ease;
      }

      input:focus {
        border-color: #84caff;
        box-shadow: 0 0 0 4px #d1e9ff;
      }

      .form-link {
        margin: -4px 0 4px;
        text-align: right;
      }

      .status {
        margin-top: 16px;
        padding: 12px 14px;
        border-radius: 8px;
        display: none;
      }

      .status.error {
        display: block;
        background: var(--danger-bg);
        color: var(--danger-text);
      }

      .small {
        color: var(--muted);
        font-size: 14px;
        margin-top: 22px;
        text-align: center;
      }

      a {
        color: var(--primary);
        font-weight: 700;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      @media (max-width: 860px) {
        .auth-shell {
          grid-template-columns: 1fr;
        }

        .brand-panel {
          display: none;
        }

        .form-panel {
          min-height: 100vh;
          padding: 24px;
        }

        .card {
          padding: 28px;
        }
      }
    </style>
  </head>
  <body>
    <main class="auth-shell">
      <section class="brand-panel" aria-label="KudiHer">
        <div class="brand">
          <span class="brand-mark">K</span>
          <span>KudiHer</span>
        </div>
        <div class="brand-copy">
        
          <p>Sign in to continue managing your account, payments, and profile from one secure place.</p>
        </div>
      </section>

      <section class="form-panel">
        <div class="card">
          <h1>Log in to your account</h1>
          <p>Welcome back. Enter your details to continue.</p>

          <a class="oauth-btn" href="/api/auth/google">
            <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.3-.2-1.9H12v3.6h5.4c-.2 1.2-.9 2.3-2 3v2.5h3.2c1.9-1.8 3-4.3 3-7.2z" />
              <path fill="#34A853" d="M12 22c2.7 0 5-0.9 6.6-2.5l-3.2-2.5c-.9.6-2 .9-3.4.9-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6C4.8 19.7 8.1 22 12 22z" />
              <path fill="#FBBC05" d="M6.4 13.8c-.2-.6-.3-1.2-.3-1.8s.1-1.2.3-1.8V7.6H3.1C2.4 9 2 10.5 2 12s.4 3 1.1 4.4l3.3-2.6z" />
              <path fill="#EA4335" d="M12 6.1c1.5 0 2.8.5 3.8 1.5l2.9-2.9C17 3 14.7 2 12 2 8.1 2 4.8 4.3 3.1 7.6l3.3 2.6C7.2 7.9 9.4 6.1 12 6.1z" />
            </svg>
            Continue with Google
          </a>
          <div class="divider">or</div>

          <form id="login-form">
            <label>
              Email
              <input id="email" type="email" required placeholder="you@example.com" autocomplete="email" />
            </label>
            <label>
              Password
              <input id="password" type="password" required placeholder="Enter your password" autocomplete="current-password" />
            </label>
            <p class="form-link">
              <a href="/forgot-password">Forgot password?</a>
            </p>
            <button class="btn primary" type="submit">Sign in</button>
          </form>

          <div class="status error" id="status"></div>
          <p class="small">
            Don't have an account? <a href="/register">Sign up</a>
          </p>
        </div>
      </section>
    </main>

    <script>
      const form = document.getElementById('login-form');
      const status = document.getElementById('status');

      const readJson = async (response) => {
        const contentType = response.headers.get('content-type') || '';
        if (!contentType.includes('application/json')) {
          throw new Error('Unable to reach the auth server. Please refresh and try again.');
        }

        return response.json();
      };

      const getCsrfToken = async () => {
        const response = await fetch('/api/auth/csrf', {
          credentials: 'same-origin'
        });
        const data = await readJson(response);

        if (!response.ok) {
          throw new Error(data.message || 'Unable to prepare secure request');
        }

        return data.csrfToken;
      };

      const showError = (message) => {
        status.textContent = message;
        status.classList.add('error');
        status.style.display = 'block';
      };

      const hideError = () => {
        status.style.display = 'none';
      };

      const params = new URLSearchParams(window.location.search);
      if (params.get('error') === 'oauth') {
        showError('Google sign-in failed or was cancelled. Try again.');
      }
      if (params.get('error') === 'oauth_config') {
        showError('Google sign-in is not configured yet.');
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        hideError();

        const payload = {
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value
        };

        try {
          const csrfToken = await getCsrfToken();
          const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-csrf-token': csrfToken
            },
            credentials: 'same-origin',
            body: JSON.stringify(payload)
          });

          const data = await readJson(response);
          if (!response.ok) {
            if (data.redirect) {
              showError(data.message || 'You do not have an account yet. Redirecting to registration...');
              window.setTimeout(() => {
                window.location.href = data.redirect;
              }, 1800);
              return;
            }
            throw new Error(data.message || 'Unable to sign in');
          }

          window.location.href = data.redirect || (data.data.onboardingComplete ? '/dashboard' : '/onboarding');
        } catch (error) {
          showError(error.message);
        }
      });
    </script>
  </body>
</html>
