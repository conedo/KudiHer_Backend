<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KudiHer Dashboard</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#101828;background:#f8fafc}*{box-sizing:border-box}
    body{margin:0;padding:24px}.page{width:min(100%,1100px);margin:auto}.top,.actions,.modal-actions{display:flex;justify-content:space-between;align-items:center;gap:12px}.top{margin-bottom:20px}h1{margin:0}h2{margin:0 0 14px;font-size:19px}.muted{color:#667085}.card{background:#fff;border:1px solid #eaecf0;border-radius:16px;padding:24px;box-shadow:0 12px 30px #1018280d}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.metric strong{display:block;font-size:25px;margin-top:8px}.forms{display:grid;grid-template-columns:1fr 1fr;gap:20px}.field{display:grid;gap:6px;margin-bottom:12px;font-weight:600;font-size:13px}input,select,textarea{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:8px;font:inherit}textarea{min-height:72px;resize:vertical}button{border:0;border-radius:8px;padding:12px 16px;background:#1570ef;color:#fff;font-weight:700;cursor:pointer}.secondary{background:#eef4ff;color:#175cd3}.status{display:none;margin:12px 0;padding:11px;border-radius:8px;background:#fef3f2;color:#b42318}.list{margin-top:20px;overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:11px 8px;border-bottom:1px solid #eaecf0;white-space:nowrap}.badge{display:inline-block;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:700;text-transform:capitalize}.green{background:#ecfdf3;color:#027a48}.yellow{background:#fffaeb;color:#b54708}.red{background:#fef3f2;color:#b42318}.grey{background:#f2f4f7;color:#475467}.modal{display:none;position:fixed;inset:0;background:#10182899;place-items:center;padding:20px}.modal .card{width:min(100%,420px)}@media(max-width:800px){.metrics,.forms{grid-template-columns:1fr 1fr}}@media(max-width:520px){.metrics,.forms{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body><main class="page">
  <header class="top"><div><h1>Business dashboard</h1><p class="muted">Record sales and expenses as they happen.</p></div><button class="secondary" id="logout">Logout</button></header>
  <div class="status" id="status" role="alert"></div>
  <section class="metrics">
    <div class="card metric"><span class="muted">Revenue</span><strong id="revenue">0</strong></div>
    <div class="card metric"><span class="muted">Profit</span><strong id="profit">0</strong></div>
    <div class="card metric"><span class="muted">Expenses</span><strong id="expenses">0</strong></div>
    <div class="card metric"><span class="muted">Net result</span><strong id="net">0</strong></div>
  </section>
  <section class="forms">
    <div class="card"><h2>Record a sale</h2><p class="muted">Select a product and quantity in the quick sale flow.</p><button id="openSale">+ New sale</button></div>
    <div class="card"><h2>Record an expense</h2><form id="expenseForm"><label class="field">Category<select id="category" required><option value="">Choose category</option><option>Rent</option><option>Utilities</option><option>Salaries</option><option>Logistics</option><option>Other</option></select></label><label class="field">Amount<input id="amount" type="number" min="0.01" step="0.01" required></label><label class="field">Description<textarea id="description" maxlength="500"></textarea></label><label class="field">Date<input id="date" type="date" required></label><button>Save expense</button></form></div>
  </section>
  <section class="card list"><h2>Inventory status</h2><table><thead><tr><th>SKU</th><th>Stock Qty</th><th>7d Avg</th><th>Days Left</th><th>Status</th><th>Margin</th></tr></thead><tbody id="inventory"></tbody></table></section>
  <section class="card list"><h2>Recent activity</h2><table><thead><tr><th>Type</th><th>Details</th><th>Amount</th><th>Date</th></tr></thead><tbody id="activity"></tbody></table></section>
</main>
<div class="modal" id="saleModal"><div class="card"><div class="top"><h2>New sale</h2><button class="secondary" type="button" id="closeSale">Cancel</button></div><form id="saleForm"><label class="field">Product<select id="product" required></select></label><label class="field">Quantity<input id="quantity" type="number" min="1" step="1" required></label><div class="modal-actions"><span class="muted" id="stock"></span><button>Confirm sale</button></div></form></div></div>
<script>
  const $=id=>document.getElementById(id), status=$('status'), products=$('product'), saleModal=$('saleModal');
  const show=(message,error=true)=>{status.textContent=message;status.style.display='block';status.style.background=error?'#fef3f2':'#ecfdf3';status.style.color=error?'#b42318':'#027a48'};
  const escapeHtml=value=>String(value).replace(/[&<>"']/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
  const json=async response=>{const data=await response.json();if(!response.ok){const error=Error(data.message||'Request failed');error.status=response.status;throw error}return data};
  const csrf=async()=>json(await fetch('/api/auth/csrf',{credentials:'include'})).then(data=>data.csrfToken);
  let refreshing;
  const refreshSession=async()=>{if(!refreshing){refreshing=(async()=>{const token=await csrf();const response=await fetch('/api/auth/refresh',{method:'POST',credentials:'include',headers:{'x-csrf-token':token}});if(!response.ok)throw Error('Authentication failed. Please log in again.');return response})().finally(()=>{refreshing=null})}return refreshing};
  const request=async(url,options={},retry=true)=>{const response=await fetch(url,{...options,credentials:'include',headers:{Accept:'application/json',...(options.headers||{})}});if(response.status===401&&retry){try{await refreshSession();return request(url,options,false)}catch(error){error.status=401;throw error}}return json(response)};
  const post=async(url,body)=>{const token=await csrf();return request(url,{method:'POST',headers:{'Content-Type':'application/json','x-csrf-token':token},body:JSON.stringify(body)})};
  let productData=[], sales=[], expenseData=[], inventoryData=[];
  const money=value=>Number(value||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  const render=()=>{const revenue=sales.reduce((sum,item)=>sum+item.revenue,0),profit=sales.reduce((sum,item)=>sum+item.profit,0),expenses=expenseData.reduce((sum,item)=>sum+item.amount,0);$('revenue').textContent=money(revenue);$('profit').textContent=money(profit);$('expenses').textContent=money(expenses);$('net').textContent=money(profit-expenses);const activity=[...sales.map(item=>({type:'Sale',details:`${item.quantity} × ${item.productName}`,amount:item.revenue,date:item.created_at})),...expenseData.map(item=>({type:'Expense',details:item.category,amount:-item.amount,date:item.date}))].sort((a,b)=>new Date(b.date)-new Date(a.date));$('activity').innerHTML=activity.slice(0,20).map(item=>`<tr><td>${escapeHtml(item.type)}</td><td>${escapeHtml(item.details)}</td><td>${money(item.amount)}</td><td>${new Date(item.date).toLocaleDateString()}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">No transactions yet.</td></tr>'};
  const renderInventory=()=>{$('inventory').innerHTML=inventoryData.map(item=>`<tr><td>${escapeHtml(item.sku)}</td><td>${item.stockQuantity}</td><td>${item.averageSales}</td><td>${item.daysLeft===null?'—':item.daysLeft}</td><td><span class="badge ${item.status}">${escapeHtml(item.statusLabel)}</span></td><td><span class="badge ${item.marginStatus}">${item.margin}%</span></td></tr>`).join('')||'<tr><td colspan="6" class="muted">No products yet.</td></tr>'};
  const load=async()=>{const [productResponse,saleResponse,expenseResponse,inventoryResponse]=await Promise.all([request('/api/products'),request('/api/sales'),request('/api/expenses'),request('/api/inventory/status')]);productData=productResponse.data;sales=saleResponse.data;expenseData=expenseResponse.data;inventoryData=inventoryResponse.data;products.innerHTML=productData.map(item=>`<option value="${item._id}">${escapeHtml(item.name)} (${item.stockQuantity??item.openingQuantity} in stock)</option>`).join('');$('stock').textContent=productData.length?`${productData[0].stockQuantity??productData[0].openingQuantity} available`:'';renderInventory();render()};
  products.addEventListener('change',()=>{const item=productData.find(product=>product._id===products.value);$('stock').textContent=item?`${item.stockQuantity??item.openingQuantity} available`:''});
  $('openSale').onclick=()=>{saleModal.style.display='grid';products.focus()};$('closeSale').onclick=()=>saleModal.style.display='none';
  $('saleForm').addEventListener('submit',async event=>{event.preventDefault();try{await post('/api/sales',{productId:products.value,quantity:Number($('quantity').value)});event.target.reset();saleModal.style.display='none';show('Sale recorded.',false);await load()}catch(error){show(error.message)}});
  $('expenseForm').addEventListener('submit',async event=>{event.preventDefault();try{await post('/api/expenses',{category:$('category').value,amount:Number($('amount').value),description:$('description').value,date:$('date').value});event.target.reset();$('date').value=new Date().toISOString().slice(0,10);show('Expense recorded.',false);await load()}catch(error){show(error.message)}});
  $('logout').onclick=async()=>{try{const token=await csrf();const response=await fetch('/api/auth/logout',{method:'POST',credentials:'include',headers:{'x-csrf-token':token}});if(!response.ok)throw Error('Unable to log out.');location.href='/login'}catch(error){show(error.message)}};
  $('date').value=new Date().toISOString().slice(0,10);load().catch(error=>{show(error.status===401?'Your session has expired. Please log in again.':error.message||'Unable to load dashboard data.');if(error.status===401){const link=document.createElement('a');link.href='/login';link.textContent=' Log in';link.style.color='#175cd3';status.append(link)}});
</script></body></html>
