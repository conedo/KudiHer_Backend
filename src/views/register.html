<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KudiHer Register</title>
    <style>
      :root {
        --bg: #f8fafc;
        --panel: #ffffff;
        --text: #101828;
        --muted: #667085;
        --line: #d0d5dd;
        --primary: #1570ef;
        --primary-hover: #175cd3;
        --danger-bg: #fef3f2;
        --danger-text: #b42318;
        --shadow: 0 20px 45px rgba(16, 24, 40, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .auth-shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(360px, 520px);
      }

      

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
        font-size: 20px;
      }

      .brand-mark {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border-radius: 8px;
        background: #ffffff;
        color: var(--primary);
        font-weight: 900;
      }

      .brand-copy {
        max-width: 560px;
      }

      .brand-copy h2 {
        margin: 0 0 16px;
        font-size: 44px;
        line-height: 1.05;
        letter-spacing: 0;
      }

      .brand-copy p {
        margin: 0;
        color: rgba(255, 255, 255, 0.84);
        font-size: 17px;
        line-height: 1.7;
      }

      .form-panel {
        display: grid;
        place-items: center;
        padding: 32px;
        position: fixed;
        inset: 0;
        z-index: 1; 
      }

      .card {
        width: min(100%, 420px);
        padding: 36px;
        border: 1px solid #eaecf0;
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 30px;
        line-height: 1.2;
      }

      p {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.55;
      }

      .btn {
        width: 100%;
        border: none;
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 15px;
        font-weight: 700;
        line-height: 1.4;
        cursor: pointer;
        transition: background 160ms ease, box-shadow 160ms ease;
      }

      .primary {
        background: var(--primary);
        color: #ffffff;
      }

      .primary:hover {
        background: var(--primary-hover);
      }

      form {
        display: grid;
        gap: 16px;
      }

      label {
        display: grid;
        gap: 8px;
        font-size: 14px;
        font-weight: 600;
        color: #344054;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font-size: 16px;
        background: #ffffff;
        color: var(--text);
        outline: none;
        transition: border-color 160ms ease, box-shadow 160ms ease;
      }

      input:focus {
        border-color: #84caff;
        box-shadow: 0 0 0 4px #d1e9ff;
      }

      .status {
        margin-top: 16px;
        padding: 12px 14px;
        border-radius: 8px;
        display: none;
      }

      .status.error {
        display: block;
        background: var(--danger-bg);
        color: var(--danger-text);
      }

      .small {
        color: var(--muted);
        font-size: 14px;
        margin-top: 22px;
        text-align: center;
      }

      a {
        color: var(--primary);
        font-weight: 600;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      @media (max-width: 860px) {
        .auth-shell {
          grid-template-columns: 1fr;
        }

        .brand-panel {
          display: none;
        }

        .form-panel {
          min-height: 100vh;
          padding: 24px;
        }

        .card {
          padding: 28px;
        }
      }
    </style>
  </head>
  <body>
    <main class="auth-shell">
      <section class="brand-panel" aria-label="KudiHer">
        <div class="brand">
          <span class="brand-mark">K</span>
          <span>KudiHer</span>
        </div>
        <div class="brand-copy">
          <h2>Start building a clearer money routine.</h2>
          <p>Create your account to keep your profile, access, and financial workspace protected.</p>
        </div>
      </section>

      <section class="form-panel">
        <div class="card">
          <h1>Create your account</h1>
          <p>Enter your details to get started.</p>

          <form id="register-form">
            <label>
              Name
              <input id="name" type="text" required placeholder="Jane Doe" autocomplete="name" />
            </label>
            <label>
              Email
              <input id="email" type="email" required placeholder="you@example.com" autocomplete="email" />
            </label>
            <label>
              Password
              <input id="password" type="password" required placeholder="Create a password" minlength="8" autocomplete="new-password" />
            </label>
            <label>
              Confirm password
              <input id="confirmPassword" type="password" required placeholder="Confirm your password" minlength="8" autocomplete="new-password" />
            </label>
            <button class="btn primary" type="submit">Sign up</button>
          </form>

          <div class="status error" id="status"></div>
          <p class="small">
            Already have an account? <a href="/auth/signin">Log in</a>
          </p>
        </div>
      </section>
    </main>

    <script>
      const form = document.getElementById('register-form');
      const status = document.getElementById('status');

      const readJson = async (response) => {
        const contentType = response.headers.get('content-type') || '';
        if (!contentType.includes('application/json')) {
          throw new Error('Unable to reach the auth server. Please refresh and try again.');
        }

        return response.json();
      };

      const getCsrfToken = async () => {
        const response = await fetch('/api/auth/csrf', {
          credentials: 'same-origin'
        });
        const data = await readJson(response);

        if (!response.ok) {
          throw new Error(data.message || 'Unable to prepare secure request');
        }

        return data.csrfToken;
      };

      const showError = (message) => {
        status.textContent = message;
        status.classList.add('error');
        status.style.display = 'block';
      };

      const hideError = () => {
        status.style.display = 'none';
      };

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        hideError();

        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password !== confirmPassword) {
          showError('Passwords do not match.');
          return;
        }

        const payload = {
          name: document.getElementById('name').value.trim(),
          email: document.getElementById('email').value.trim(),
          password
        };

        try {
          const csrfToken = await getCsrfToken();
          const response = await fetch('/api/auth/register', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-csrf-token': csrfToken
            },
            credentials: 'same-origin',
            body: JSON.stringify(payload)
          });

          const data = await readJson(response);
          if (!response.ok) {
            throw new Error(data.message || 'Unable to sign up');
          }

          window.location.href = data.redirect || '/onboarding/business';
        } catch (error) {
          showError(error.message);
        }
      });
    </script>
  </body>
</html>
